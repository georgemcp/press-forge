services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://trimproof.com}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_CONTAINER_ID: ${NEXT_PUBLIC_GTM_CONTAINER_ID:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${TRIMPROOF_WEB_CPUS:-2.0}"
    mem_limit: "${TRIMPROOF_WEB_MEMORY_LIMIT:-2g}"
    pids_limit: 256
    ports:
      - "127.0.0.1:${TRIMPROOF_HOST_PORT:-3047}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://trimproof.com}
      REDIS_URL: redis://redis:6379
      TRIMPROOF_GENERATED_DIR: /app/.trimproof-generated
    volumes:
      - trimproof-generated:/app/.trimproof-generated
    depends_on:
      - redis

  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://trimproof.com}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_CONTAINER_ID: ${NEXT_PUBLIC_GTM_CONTAINER_ID:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${TRIMPROOF_WORKER_CPUS:-2.0}"
    mem_limit: "${TRIMPROOF_WORKER_MEMORY_LIMIT:-3g}"
    pids_limit: 256
    command: ["npm", "run", "worker"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://trimproof.com}
      REDIS_URL: redis://redis:6379
      TRIMPROOF_GENERATED_DIR: /app/.trimproof-generated
    volumes:
      - trimproof-generated:/app/.trimproof-generated
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    user: redis
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${TRIMPROOF_REDIS_CPUS:-0.5}"
    mem_limit: "${TRIMPROOF_REDIS_MEMORY_LIMIT:-512m}"
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - trimproof-redis:/data

volumes:
  trimproof-redis:
  trimproof-generated:
