services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://trimproof.com}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_CONTAINER_ID: ${NEXT_PUBLIC_GTM_CONTAINER_ID:-}
        OCI_REVISION: ${TRIMPROOF_IMAGE_REVISION:-unknown}
        OCI_SOURCE: ${TRIMPROOF_IMAGE_SOURCE:-https://github.com/georgemcp/press-forge}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${TRIMPROOF_WEB_CPUS:-2.0}"
    mem_limit: "${TRIMPROOF_WEB_MEMORY_LIMIT:-2g}"
    pids_limit: 256
    ports:
      - "127.0.0.1:${TRIMPROOF_HOST_PORT:-3047}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://trimproof.com}
      REDIS_URL: redis://redis:6379
      TRIMPROOF_GENERATED_DIR: /app/.trimproof-generated
    volumes:
      - trimproof-generated:/app/.trimproof-generated
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          try { const response = await fetch('http://127.0.0.1:3000/api/health',
          { signal: AbortSignal.timeout(3000) }); const body = await response.json();
          if (!response.ok || body.ok !== true) process.exit(1); } catch { process.exit(1); }
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://trimproof.com}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_CONTAINER_ID: ${NEXT_PUBLIC_GTM_CONTAINER_ID:-}
        OCI_REVISION: ${TRIMPROOF_IMAGE_REVISION:-unknown}
        OCI_SOURCE: ${TRIMPROOF_IMAGE_SOURCE:-https://github.com/georgemcp/press-forge}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${TRIMPROOF_WORKER_CPUS:-2.0}"
    mem_limit: "${TRIMPROOF_WORKER_MEMORY_LIMIT:-3g}"
    pids_limit: 256
    command: ["npm", "run", "worker"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://trimproof.com}
      REDIS_URL: redis://redis:6379
      TRIMPROOF_GENERATED_DIR: /app/.trimproof-generated
    volumes:
      - trimproof-generated:/app/.trimproof-generated
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          import Redis from 'ioredis'; const redis = new Redis(process.env.REDIS_URL,
          { lazyConnect: true, maxRetriesPerRequest: 0, connectTimeout: 2000 });
          try { await redis.connect(); if (await redis.ping() !== 'PONG') process.exitCode = 1; }
          catch { process.exitCode = 1; } finally { redis.disconnect(); }
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    init: true
    user: redis
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "${TRIMPROOF_REDIS_CPUS:-0.5}"
    mem_limit: "${TRIMPROOF_REDIS_MEMORY_LIMIT:-512m}"
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - trimproof-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  trimproof-redis:
  trimproof-generated:
