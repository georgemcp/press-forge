limit_req_zone $binary_remote_addr zone=trimproof_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=trimproof_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=trimproof_per_ip:10m;

map $http_upgrade $trimproof_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  server_name trimproof.com www.trimproof.com;

  if ($host = www.trimproof.com) {
    return 308 https://trimproof.com$request_uri;
  }

  server_tokens off;
  client_max_body_size 12m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  keepalive_timeout 65s;
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn trimproof_per_ip 40;

  add_header Content-Security-Policy "base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $trimproof_connection_upgrade;
  proxy_connect_timeout 10s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_hide_header Server;
  proxy_hide_header X-Powered-By;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Permitted-Cross-Domain-Policies;

  location ~ ^/(?:api/auth/(?:login|signup)|api/email-signup|admin/login)/?$ {
    limit_req zone=trimproof_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:3047;
  }

  location /api/ {
    limit_req zone=trimproof_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:3047;
  }

  location ~ /\.(?!well-known(?:/|$)) {
    deny all;
  }

  location / {
    proxy_pass http://127.0.0.1:3047;
  }

  listen [::]:443 ssl; # managed by Certbot
  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/trimproof.com/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/trimproof.com/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = www.trimproof.com) {
    return 301 https://trimproof.com$request_uri;
  } # managed by Certbot

  if ($host = trimproof.com) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  listen [::]:80;
  server_name trimproof.com www.trimproof.com;
  return 404; # managed by Certbot
}
